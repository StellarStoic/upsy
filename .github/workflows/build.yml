name: build and deploy

on:
  schedule:
    # Every ten minutes. GitHub queues scheduled work under load, so treat this as "roughly ten
    # minutes" rather than a promise - the page shows the age of the build it is looking at.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Only changes that can alter the output. A push that only touches data/ must not loop.
    paths:
      - "sources.json"
      - "tools/**"
      - ".github/workflows/**"
      - "tests/**"

permissions:
  contents: read
  pages: write
  id-token: write
  models: read

concurrency:
  group: upsy-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Pillow is the one dependency: it shrinks each publisher's picture to the size the page draws
      # it. Without it the build still works, but the pictures ship at their original size (measured:
      # 1.1 MB PNGs, and a whole front page worth of them) because a plain stdlib build cannot
      # transcode an image. Everything else here is standard library.
      - name: install the image pipeline
        run: python3 -m pip install --disable-pip-version-check --quiet "pillow>=10,<14"

      # The fetcher's dedup state, so a story stays "already seen" between runs without committing
      # a few hundred kilobytes of JSON every ten minutes.
      - name: restore the fetcher state
        uses: actions/cache@v4
        with:
          path: |
            data/state.json
            data/images
            data/shots
            data/shots.json
            # what the builder could not picture: the screenshot step reads it on the next run, so it has
            # to survive the gap between runs or the step always sees an empty list
            data/pictures.json
          key: upsy-state-${{ github.run_id }}
          restore-keys: |
            upsy-state-

      - name: read the feeds
        run: python3 tools/fetch.py

      # Writes the upsy moments with the workflow's own token. A refusal, a rate limit or a broken
      # reply falls back to the rules, so this step must never be able to stop the site.
      - name: write the upsy moments
        continue-on-error: true
        env:
          # The workflow's own token needs `models: read` to be accepted by GitHub Models. If you add
          # a key of your own as the repository secret UPSY_LLM_API_KEY, it is used instead - and if
          # neither works, moments.py falls back to the ranked candidates and the site still builds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSY_LLM_API_KEY: ${{ secrets.UPSY_LLM_API_KEY }}
          UPSY_LLM_MODEL: ${{ vars.UPSY_LLM_MODEL }}
        run: python3 tools/moments.py

      # Roughly half the feeds carry no picture. A headless Chrome, already on the runner image,
      # shoots the story's own page instead - and data/shots rides the cache above, so each page is
      # shot once. continue-on-error is deliberate: no browser, no screenshots, no problem.
      - name: screenshot the stories with no picture
        continue-on-error: true
        run: python3 tools/screenshots.py --max 60 --verify 40

      - name: build the site
        run: python3 tools/build_site.py

      - name: upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
